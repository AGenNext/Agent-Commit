name: Governance

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

defaults:
  run:
    shell: bash

jobs:
  governance:
    name: Consume Checks governance evidence
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Agent-Commit
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          path: target

      - name: Checkout transitional validator
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          repository: AGenNext/Agent-deploy
          path: agent-deploy-validator

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Run transitional governance validation
        run: ./agent-deploy-validator/scripts/validate_repo_governance.sh ./target
